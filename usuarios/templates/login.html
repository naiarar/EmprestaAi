{% extends 'base.html' %}

{% block 'titulo' %}Login{% endblock %}

{% block 'conteudo' %}

<div class="container py-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <h1>Login</h1>
            <hr>

            <form method="POST" action="{% url 'login' %}" novalidate>{% csrf_token %}
                {% include '_campos_form.html' %}
                <input type="hidden" name="next" value="{{ next }}">
                <input class="btn btn-info btn-lg" type="submit" value="Entrar">
                <a href="{% url 'cadastro' %}" class="btn btn-outline-info btn-lg">Cadastro</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
