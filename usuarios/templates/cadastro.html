{% extends 'base.html' %}

{% block 'titulo' %}Cadastro{% endblock %}

{% block 'conteudo' %}

<div class="container py-4">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <h1>Cadastre-se</h1>
      <hr>

      <form method="POST" action="{% url 'cadastro' %}" novalidate>
        {% csrf_token %}
        {% include '_campos_form.html' %}
        <input class="btn btn-info btn-lg" type="submit" value="Enviar">
        <a href="{% url 'login' %}" class="btn btn-outline-info btn-lg">Login</a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
